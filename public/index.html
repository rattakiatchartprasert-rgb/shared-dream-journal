<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Dream Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Share Your Dream</h1>
      <form id="dream-form">
        <input
          type="text"
          id="dream-title"
          placeholder="Dream Title"
          required
        />
        <textarea
          id="dream-content"
          placeholder="What's your dream about?"
          rows="4"
          required
        ></textarea>
        <button type="submit">Share Dream</button>
      </form>

      <div class="list-header">
        <h2>Recent Dreams</h2>
      </div>

      <div class="controls-wrapper">
        <div class="search-bar">
          <input
            type="search"
            id="search-input"
            placeholder="Search in dreams..."
          />
        </div>
        
        <div class="sort-controls">
          <select id="sort-select">
            <option value="latest">Sort: Latest</option>
            <option value="oldest">Sort: Oldest</option>
          </select>
        </div>
      </div>

      <div id="dream-list"></div>

      <div class="pagination-controls">
        <button id="btn-prev" disabled>Previous</button>
        <span id="page-info">Page 1</span>
        <button id="btn-next">Next</button>
      </div>
    </div>
    <script src="script.js"></script>

    <div id="edit-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h2>Edit Your Dream</h2>
        <form id="edit-form">
          <input type="hidden" id="edit-dream-id" />
          <label for="edit-dream-title">Title</label>
          <input type="text" id="edit-dream-title" required />
          <label for="edit-dream-content">Content</label>
          <textarea id="edit-dream-content" rows="5" required></textarea>
          <div class="modal-buttons">
            <button type="button" id="btn-cancel">Cancel</button>
            <button type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
    <div id="toast-container"></div>

  </body>
</html>
